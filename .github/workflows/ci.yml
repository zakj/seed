name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run

  mac:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: mac-app
      - uses: actions/cache@v5
        with:
          path: mac/.build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('mac/Package.resolved') }}
      # Builds the app target as well as the tests, so this is also the check
      # that the app still compiles for the macOS version it claims to support.
      - run: swift test
        working-directory: mac
      # `swift test` covers the code; this covers the bundle around it — the
      # Info.plist, the icon, the bundled `sd`, the signature. Nothing else
      # exercises build.sh, so without this it only breaks at release time.
      - run: ./mac/build.sh
      - name: Check the bundle is complete
        run: |
          app=mac/Seed.app
          for f in Contents/MacOS/Seed Contents/MacOS/sd Contents/Info.plist \
                   Contents/Resources/Seed.icns Contents/Resources/Credits.html; do
            test -e "$app/$f" || { echo "missing $f"; exit 1; }
          done
          # The bundled sd has to be the one just built, not a stale copy a
          # CARGO_TARGET_DIR could have left at the path build.sh copies from.
          # The plist is stamped from that same binary, so holding both against
          # Cargo.toml catches the stale copy and a bundle shipped without its
          # stamp with one comparison each.
          want=$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)
          got=$("$app/Contents/MacOS/sd" --version | awk '{print $2}')
          test "$got" = "$want" || { echo "bundled sd is $got, want $want"; exit 1; }
          got=$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")
          test "$got" = "$want" || { echo "plist says $got, want $want"; exit 1; }
          codesign --verify --strict "$app"
