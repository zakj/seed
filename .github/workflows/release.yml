name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-15
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: tar czf sd-${TAG}-${TARGET}.tar.gz -C target/${TARGET}/release sd
      - uses: actions/upload-artifact@v5
        with:
          name: sd-${{ matrix.target }}
          path: sd-*.tar.gz

  # Apple Silicon only, and named after the arch actually built rather than a
  # hardcoded one: if the runner image ever changes arch the filename tells the
  # truth, and the assertion below turns it into a failed release instead of a
  # zip that silently will not launch on the machines it is aimed at.
  mac-app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: mac-app
      - run: ./mac/build.sh --release
      - name: Package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          arch=$(uname -m)
          test "$arch" = "arm64" || { echo "expected an arm64 runner, got $arch"; exit 1; }
          lipo -archs mac/Seed.app/Contents/MacOS/sd | grep -qw arm64
          # ditto, not zip: an .app is a bundle, and zip loses the symlinks and
          # extended attributes that keep the signature valid.
          ditto -c -k --sequesterRsrc --keepParent \
            mac/Seed.app "Seed-${TAG}-${arch}.zip"
      - uses: actions/upload-artifact@v5
        with:
          name: seed-app
          path: Seed-*.zip

  release:
    needs: [build, mac-app]
    runs-on: ubuntu-latest
    steps:
      # Held at v5 deliberately: v8 stops unzipping unconditionally and
      # decides by Content-Type, which is the one change that could bite a
      # release whose asset is itself a .zip.
      - uses: actions/download-artifact@v5
        with:
          merge-multiple: true
      - run: ls -la sd-*.tar.gz Seed-*.zip
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" sd-*.tar.gz Seed-*.zip --generate-notes
